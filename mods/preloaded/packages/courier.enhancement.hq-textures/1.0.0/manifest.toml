name = "Always High-Detail Textures"
description = "The game swaps building textures for sharper ones when you come close. This keeps the sharp ones at every distance. Applies the next time the game starts. Draws more detail, so heavy scenes cost a little more CPU."
group = "Picture"
default_enabled = true

