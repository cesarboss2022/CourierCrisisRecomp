format_version = 11
id = "courier.enhancement.smooth-motion"
version = "1.0.0"
name = "Smooth Motion"
author = "local"
description = "Presentation-only temporal blending of completed game frames at the display refresh. Game logic, timers and audio keep their stock speed."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00442"
disc_sha256 = "307fd3c7fd3ef5ac61accb3457171947767dfc6a8690f5023ca8230ee5c60127"

[[feature]]
id = "smooth-motion"
name = "Smooth Motion"
description = "Blend completed game frames at the chosen rate. It is a crossfade: it does not invent motion, so moving objects can show a faint double image. Requires OpenGL and turns VSync off while enabled."
group = "Frame Rate"
default_enabled = false
vsync = "off"

[[option]]
feature = "smooth-motion"
id = "rate"
label = "Output rate"
description = "Display refresh follows your monitor for an even cadence. A fixed rate is mainly for testing."
group = "Frame Rate"
type = "choice"
default = "display"

[[option.choice]]
value = "display"
label = "Display refresh (Recommended)"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option]]
feature = "smooth-motion"
id = "blend"
label = "Blend"
description = "Linear is a full-frame crossfade. Adaptive keeps the crossfade for small changes and switches large changes cleanly, which reduces double-image trails."
group = "Frame Rate"
type = "choice"
default = "linear"

[[option.choice]]
value = "linear"
label = "Linear"

[[option.choice]]
value = "adaptive"
label = "Motion adaptive"

[[option]]
feature = "smooth-motion"
id = "source"
label = "Frame source"
description = "Flip blends across each real game frame, which suits this game's 30 Hz updates. VBlank blends on every VBlank and can alternate between a blend and a held frame."
group = "Frame Rate"
type = "choice"
default = "flip"

[[option.choice]]
value = "flip"
label = "Flip (Recommended)"

[[option.choice]]
value = "vblank"
label = "VBlank"

[[plugin]]
feature = "smooth-motion"
id = "courier.smooth-motion"
